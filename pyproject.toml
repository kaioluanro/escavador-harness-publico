[project]
name = "harness"
version = "0.1.0"
description = "Harness de busca conversacional sobre o Diário Oficial (DOM Teresina)."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pymupdf>=1.24",
    "pydantic>=2.7",
    "typer>=0.12",
    "pymupdf4llm>=1.28.2",
    "laya>=0.3.22",
    "rlms>=0.1.3",
]

[project.scripts]
harness = "harness.cli:app"

[project.optional-dependencies]
ner = [
    "torch>=2.14.0",
    "transformers>=5.17.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Índice do PyTorch só para `torch` (explicit + sources): com a estratégia
# padrão `first-index` ele era consultado para TODO pacote e um `requests`
# antigo hospedado ali quebrava o lock do `rlms` (T031).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.hatch.build.targets.wheel]
packages = ["harness"]

[tool.pytest.ini_options]
testpaths = ["harness/tests", "harness/eval/tests"]
addopts = "-q"
